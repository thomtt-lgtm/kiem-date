.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font:700 21px/1.2 var(--fh);margin:0}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}

textarea{min-height:64px;resize:vertical}

:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cnt{font-size:13px;font-weight:600;color:var(--mu);white-space:nowrap}
.it{border-top:1px solid var(--bd);padding:10px 0}

.th{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--bd)}

.lv button.a{background:var(--gbg);border-color:var(--g);color:var(--g)}
.lv button.b{background:var(--ambbg);border-color:var(--amb);color:var(--amb)}

.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px}
.btn{padding:12px 16px;border-radius:8px;border:0;background:var(--g);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;min-height:46px}
.btn.o{background:transparent;color:var(--g);border:1px solid var(--g)}
.btn.s{padding:8px 12px;min-height:38px;font-size:14px}
.x{border:0;background:transparent;color:var(--red);font:inherit;font-size:13px;cursor:pointer;padding:4px 8px}
.na{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.na input{width:20px;height:20px;accent-color:var(--g)}

.sg:first-child{border-top:0}
.sg:active,.sg:hover{background:var(--gbg)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts .btn{flex:1 1 180px}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.5 var(--fb);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:0}

.nav{display:flex;border:1px solid var(--bd);border-radius:99px;overflow:hidden;background:var(--card)}
.nav button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:14px;padding:9px 16px;cursor:pointer;min-height:42px}
.nav button.on{background:var(--g);color:var(--ink);font-weight:600}
.srow{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;color:var(--fg);font:inherit;cursor:pointer}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpis div{display:flex;flex-direction:column;gap:2px}
.kpis b{font:700 24px/1.1 var(--fh)}
.kpis .mu{font-size:12px}

body{margin:0;background:var(--bg)}

function bsZoom(){
  var c=bsCaps();if(!c.zoom){bsMsg('Máy không hỗ trợ zoom');return;}
  var mx=c.zoom.max||1,st=[1,2,3].filter(function(z){return z<=mx;});if(st.length<2)st=[c.zoom.min||1,mx];
  var i=st.indexOf(BS.zoom);BS.zoom=st[(i+1)%st.length];
  bsTrack().applyConstraints({advanced:[{zoom:BS.zoom}]}).catch(function(){});
  bsEl('bsZm').textContent='🔍 '+(Math.round(BS.zoom*10)/10)+'x';
}
function bsTorch(){
  var c=bsCaps();if(!c.torch){bsMsg('Máy không hỗ trợ bật đèn');return;}
  BS.torch=!BS.torch;bsTrack().applyConstraints({advanced:[{torch:BS.torch}]}).catch(function(){});
  bsEl('bsTc').style.background=BS.torch?'#fff3d6':'#f6f8f7';
}
function bsStart(devId){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){bsMsg('Máy không mở được camera trực tiếp. Bấm "Hoặc chụp ảnh mã vạch".');return;}
  var vc=devId?{deviceId:{exact:devId},width:{ideal:1920},height:{ideal:1080}}:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}};
  navigator.mediaDevices.getUserMedia({video:vc,audio:false}).then(function(st){
    BS.stream=st;var v=bsEl('bsVid');if(!v){bsStop();return;}
    v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.muted=true;v.controls=false;v.disablePictureInPicture=true;
    v.srcObject=st;
    var pl=function(){var p=v.play();if(p&&p.catch)p.catch(function(){bsMsg('Chạm vào khung camera một lần để bật');});};
    v.onclick=pl;pl();
    try{var cp=bsCaps();if(cp.focusMode&&cp.focusMode.indexOf('continuous')>=0)bsTrack().applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(function(){});}catch(e){}
    bsMsg('Đặt mã vạch vào khung xanh, cách 10-15cm');
    var cv=document.createElement('canvas');
    function vis(){var W=v.videoWidth,H=v.videoHeight,vb=v.parentNode,ba=vb.clientWidth/vb.clientHeight,va=W/H,w=W,h=H,x=0,y=0;
      if(va>ba){w=Math.round(H*ba);x=Math.round((W-w)/2);}else{h=Math.round(W/ba);y=Math.round((H-h)/2);}
      return {x:x,y:y,w:w,h:h};}
    function grab(sx,sy,sw,sh,maxW,enh){
      var k=Math.min(2,maxW/sw);cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);
      var x=cv.getContext('2d');x.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
      if(enh){try{var im=x.getImageData(0,0,cv.width,cv.height),d=im.data,lo=255,hi=0,i,g;
        for(i=0;i<d.length;i+=4){g=(d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11);d[i]=g;if(g<lo)lo=g;if(g>hi)hi=g;}
        var sc=hi>lo?255/(hi-lo):1;
        for(i=0;i<d.length;i+=4){g=(d[i]-lo)*sc;d[i]=d[i+1]=d[i+2]=g;}
        x.putImageData(im,0,0);}catch(e){}}
      return cv;
    }
    function tryFrame(){
      var q=vis(),fx=q.x+Math.round(q.w*.1),fy=q.y+Math.round(q.h*.3),fw=Math.round(q.w*.8),fh=Math.round(q.h*.4);
      var cr=[[fx,fy,fw,fh,1600,false],[fx,fy,fw,fh,1600,true],[q.x,q.y,q.w,q.h,1280,true],[q.x,q.y,q.w,q.h,1280,false]];
      var i=0;
      return (function next(){
        if(i>=cr.length)return Promise.resolve(null);
        var a=cr[i++];
        return bsDecode(grab(a[0],a[1],a[2],a[3],a[4],a[5])).then(function(c){return c||next();});
      })();
    }
    BS.snap=function(){if(!v.videoWidth){bsMsg('Camera chưa sẵn sàng, chạm vào khung camera rồi thử lại');return;}bsMsg('Đang đọc...');tryFrame().then(function(c){if(c)bsDone(c);else bsMsg('Chưa đọc được. Đưa mã vạch lại gần, giữ thẳng ngang, đủ sáng rồi bấm lại.');});};
    BS.timer=setInterval(function(){
      if(BS.busy||BS.done)return;
      if(!v.videoWidth||v.paused){bsMsg('Camera chưa chạy. Chạm vào khung camera để bật.');return;}
      BS.busy=true;
      tryFrame().then(function(c){BS.busy=false;if(c)bsDone(c);else if(!BS.done)bsMsg('Đang quét... Đặt mã vạch vào khung xanh, cách 10-15cm');});
    },300);
  }).catch(function(){bsMsg('Không mở được camera trên trang này. Bấm "Hoặc chụp ảnh mã vạch".');});
}
function bsDone(c){
  if(BS.done)return;BS.done=true;
  bsMsg('✔ Đã quét: '+c,true);
  try{if(navigator.vibrate)navigator.vibrate(80);}catch(e){}
  setTimeout(function(){bsGot(c);},600);
}
function bsClose(){bsStop();BS.done=true;var o=bsEl('bsBox');if(o)o.remove();}
function bsFind(c){
  var d=String(c).replace(/\D/g,''),z=d.replace(/^0+/,'');if(!d)return null;
  for(var i=0;i<SK.length;i++){var s=SK[i],b=String(s.bc||'').replace(/\D/g,'');
    if(s.ma===d||s.ma===String(c))return s;
    if(b&&(b===d||b.replace(/^0+/,'')===z))return s;}
  return null;
}
function bsGot(c){
  var i=BS.row;bsClose();var r=R();if(!r||!r.rows[i])return;
  var x=bsFind(c),w=r.rows[i],inp=bsEl('r'+i+'sp');
  if(x){w.sp=x.ten+' ('+x.ma+')';w.ma=x.ma;if(inp)inp.value=w.sp;var sg=bsEl('r'+i+'sug');if(sg)sg.hidden=true;
    var c3=bsEl('cnt-rows');if(c3)c3.textContent=rowStat(r);persist(r);var hh=bsEl('r'+i+'h');if(hh)hh.focus();}
  else{var dg=String(c).replace(/\D/g,'');w.sp=dg;w.ma='';if(inp){inp.value=dg;}showSug(i,dg);persist(r);toast('Không tìm thấy mã '+c+' trong danh mục. Chọn sản phẩm trong gợi ý hoặc gõ tên.');}
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-bscan]');
  if(b){e.preventDefault();e.stopPropagation();bsEnsure(function(){});bsOpen(+b.dataset.bscan);}
},true);

</script></body></html>
